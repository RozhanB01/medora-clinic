name: NOVEMBER LINE execution request

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: november-line-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare-execution:
    if: startsWith(github.event.issue.title, '[NOVEMBER LINE EXECUTION]') && github.event.issue.user.login == github.repository_owner
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: دریافت نسخه اصلی
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: ایجاد شناسه و فایل درخواست بدون اجرای متن کاربر
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="november-line/mission-$ISSUE_NUMBER"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "november-line-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git switch -c "$BRANCH" --track "origin/$BRANCH"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch -c "$BRANCH" --track "origin/$BRANCH"
          else
            git switch -c "$BRANCH" "origin/$DEFAULT_BRANCH"
          fi
          mkdir -p .november-line/requests
          node <<'NODE'
          const fs = require('fs');
          const issue = Number(process.env.ISSUE_NUMBER);
          if (!Number.isSafeInteger(issue) || issue < 1) throw new Error('Invalid issue number');
          const text = [
            '# درخواست اجرای NOVEMBER LINE',
            '',
            'شماره: #'+issue,
            'ثبت‌کننده: '+process.env.ISSUE_AUTHOR,
            '',
            '## عنوان',
            process.env.ISSUE_TITLE || '',
            '',
            '## متن درخواست',
            process.env.ISSUE_BODY || '',
            '',
            '## وضعیت',
            'در انتظار پیاده‌سازی واقعی کد، تست و بررسی انسانی.',
            'این گردش‌کار فقط درخواست را ثبت می‌کند و Agent خودکار اجرا نمی‌کند.'
          ].join('\n');
          fs.writeFileSync('.november-line/requests/issue-'+issue+'.md',text,'utf8');
          NODE
          git add ".november-line/requests/issue-$ISSUE_NUMBER.md"
          if ! git diff --cached --quiet; then
            git commit -m "chore(november-line): register request #$ISSUE_NUMBER"
            git push origin "$BRANCH"
          fi

      - name: ایجاد پیش‌نویس قابل بررسی
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="november-line/mission-$ISSUE_NUMBER"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh pr create --draft --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "NOVEMBER LINE · درخواست #$ISSUE_NUMBER" \
              --body "متصل به Issue #$ISSUE_NUMBER. این PR فقط ثبت اولیه درخواست است و به‌معنای تغییر واقعی کد یا انجام QA نیست. ادغام بعد از پیاده‌سازی، تست و تأیید مدیرعامل."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "درخواست ثبت شد. شاخه \`$BRANCH\` و Draft PR اولیه ایجاد/بررسی شدند. هنوز کدنویسی خودکار انجام نشده است."
